[package]
name = "controlled-pc"
version = "1.0.2"
edition = "2024"

[dependencies]
aes-gcm = "0.10"
enigo = "0.2"
hkdf = "0.12"
hostname = "0.4.2"
image = { version = "0.25", default-features = false, features = ["png"] }
mdns-sd = "0.21.7"
p256 = { version = "0.13", features = ["ecdh"] }
rand = "0.8"
sha2 = "0.10"
sys-locale = "0.3"
tao = "0.26"
tray-icon = "0.14"
windows = { version = "0.52", features = ["ApplicationModel", "ApplicationModel_Activation", "Foundation", "Storage"] }
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_System_Registry", "Win32_UI_WindowsAndMessaging"] }
wry = "0.37"

[profile.release]
strip = true
lto = true
